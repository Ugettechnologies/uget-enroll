# Netlify configuration for TanStack Start + Nitro
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Redirect all SSR and API requests to the Nitro Netlify Server function
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200

